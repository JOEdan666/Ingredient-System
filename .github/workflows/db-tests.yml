name: PostgreSQL domain tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: test-only-not-secret
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: app_test
      PGPASSWORD: test-only-not-secret
      PGDATABASE: app_test
      REQUIRE_PG18: "1"
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.20"
      - name: Run all domain tests on PostgreSQL 18
        working-directory: application
        run: uv run --frozen pytest -ra
      - name: Verify concurrency suite and count
        working-directory: application
        run: |
          uv run --frozen pytest -m concurrency --junitxml=concurrency.xml -ra
          uv run --frozen python check_concurrency_junit.py concurrency.xml
