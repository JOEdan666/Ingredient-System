name: pytest (prototype, import-spike)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: prototype/ pytest (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-09-27
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0 resolved 2026-09-29
        with:
          version: "0.12.20"
      - name: Run prototype/ pytest (frozen lockfile)
        working-directory: prototype
        run: uv run --frozen pytest -ra

  import-spike:
    name: import-spike/ pytest (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-09-27
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0 resolved 2026-09-29
        with:
          version: "0.12.20"
      - name: Run import-spike/ pytest (frozen lockfile)
        working-directory: import-spike
        run: uv run --frozen pytest -ra
