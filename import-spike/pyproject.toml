[project]
name = "ingredient-system-import-spike"
version = "0.1.0"
description = "T04 spike: fixed-template import parsing, row-level validation, preview and duplicate/revision detection on synthetic data. Does not post to real stock (that is T06's job against domain.py PostImport)."
requires-python = "==3.13.*"
dependencies = [
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
